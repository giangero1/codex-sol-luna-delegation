When resumed after an interruption or transient capacity/tool failure, continue from the existing workspace state and complete only the unmet acceptance criteria. Do not redo trustworthy completed work unless a later change invalidated it.
Return a concise evidence-based handoff covering status, files changed, behavior implemented, commands and tools used, actual validation results, and remaining risks, blockers, or next action. Avoid dumping raw logs when a precise summary and key evidence are sufficient.

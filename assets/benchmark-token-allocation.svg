<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Token allocation before and after the delegation workflow</title>
  <desc id="desc">Two horizontal stacked bars compare a baseline run with a run using the finished delegation workflow. The rounded baseline used 1.94 million Sol and 1.81 million Luna tokens. The workflow benchmark used exactly 403,852 Sol and 4,230,396 Luna tokens.</desc>

  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="80" y="65" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">Token allocation: baseline vs delegation workflow</text>
  <text x="80" y="100" fill="#4b5563" font-family="Arial, sans-serif" font-size="17">Same bounded Unity editor diagnostics task · Baseline counts rounded · Workflow benchmark exact</text>

  <rect x="760" y="110" width="18" height="18" rx="3" fill="#2563eb"/>
  <text x="790" y="125" fill="#111827" font-family="Arial, sans-serif" font-size="16">Sol coordinator</text>
  <rect x="950" y="110" width="18" height="18" rx="3" fill="#f59e0b"/>
  <text x="980" y="125" fill="#111827" font-family="Arial, sans-serif" font-size="16">Luna executor</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="280" y1="155" x2="280" y2="440"/>
    <line x1="430" y1="155" x2="430" y2="440"/>
    <line x1="580" y1="155" x2="580" y2="440"/>
    <line x1="730" y1="155" x2="730" y2="440"/>
    <line x1="880" y1="155" x2="880" y2="440"/>
    <line x1="1030" y1="155" x2="1030" y2="440"/>
  </g>

  <g fill="#4b5563" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="280" y="470">0</text>
    <text x="430" y="470">1M</text>
    <text x="580" y="470">2M</text>
    <text x="730" y="470">3M</text>
    <text x="880" y="470">4M</text>
    <text x="1030" y="470">5M</text>
    <text x="655" y="505" fill="#111827" font-size="17">Tokens</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="80" y="230" fill="#111827" font-size="20" font-weight="700">Without finished</text>
    <text x="80" y="256" fill="#111827" font-size="20" font-weight="700">delegation workflow</text>
    <rect x="280" y="205" width="291" height="58" rx="7" fill="#2563eb"/>
    <rect x="571" y="205" width="271.5" height="58" rx="7" fill="#f59e0b"/>
    <text x="425.5" y="241" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Sol 1.94M</text>
    <text x="706.8" y="241" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Luna 1.81M</text>
    <text x="862" y="241" fill="#111827" font-size="17" font-weight="700">3.75M total</text>

    <text x="80" y="365" fill="#111827" font-size="20" font-weight="700">With delegation</text>
    <text x="80" y="391" fill="#111827" font-size="20" font-weight="700">workflow</text>
    <rect x="276" y="337" width="703.3" height="66" rx="10" fill="none" stroke="#111827" stroke-width="3"/>
    <rect x="280" y="341" width="60.6" height="58" rx="7" fill="#2563eb"/>
    <rect x="340.6" y="341" width="634.6" height="58" rx="7" fill="#f59e0b"/>
    <text x="658" y="377" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Luna 4,230,396</text>
    <text x="994" y="377" fill="#111827" font-size="17" font-weight="700">4,634,248 total</text>
    <line x1="310" y1="331" x2="310" y2="316" stroke="#2563eb" stroke-width="2"/>
    <text x="310" y="306" fill="#2563eb" font-size="16" font-weight="700" text-anchor="middle">Sol 403,852</text>
  </g>

  <text x="280" y="540" fill="#111827" font-family="Arial, sans-serif" font-size="17" font-weight="700">Sol share: 51.7% → 8.7%</text>
  <text x="610" y="540" fill="#111827" font-family="Arial, sans-serif" font-size="17" font-weight="700">Luna share: 48.3% → 91.3%</text>

  <line x1="80" y1="565" x2="1120" y2="565" stroke="#d1d5db"/>
  <text x="80" y="595" fill="#4b5563" font-family="Arial, sans-serif" font-size="15">Source: Giangero Studio internal runs · Intermediate setup/tuning attempt excluded · Not independently reproduced</text>
</svg>

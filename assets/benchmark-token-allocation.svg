<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Observed token allocation across three internal Sol–Luna delegation tests</title>
  <desc id="desc">Three horizontal stacked bars compare Sol and Luna token usage. Test 1 used 1.94 million Sol and 1.81 million Luna tokens. Test 2 used 3.13 million Sol and 1.43 million Luna tokens. Test 3 used 403,852 Sol and 4,230,396 Luna tokens, showing 8.7 percent Sol and 91.3 percent Luna.</desc>

  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="80" y="70" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="700">Observed token allocation across three delegation tests</text>
  <text x="80" y="105" fill="#4b5563" font-family="Arial, sans-serif" font-size="17">Tests 1–2 are rounded to 0.01M; Test 3 uses exact counts.</text>

  <rect x="760" y="108" width="18" height="18" rx="3" fill="#2563eb"/>
  <text x="790" y="123" fill="#111827" font-family="Arial, sans-serif" font-size="16">Sol coordinator</text>
  <rect x="950" y="108" width="18" height="18" rx="3" fill="#f59e0b"/>
  <text x="980" y="123" fill="#111827" font-family="Arial, sans-serif" font-size="16">Luna executor</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="220" y1="145" x2="220" y2="545"/>
    <line x1="380" y1="145" x2="380" y2="545"/>
    <line x1="540" y1="145" x2="540" y2="545"/>
    <line x1="700" y1="145" x2="700" y2="545"/>
    <line x1="860" y1="145" x2="860" y2="545"/>
    <line x1="1020" y1="145" x2="1020" y2="545"/>
  </g>

  <g fill="#4b5563" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="220" y="575">0</text>
    <text x="380" y="575">1M</text>
    <text x="540" y="575">2M</text>
    <text x="700" y="575">3M</text>
    <text x="860" y="575">4M</text>
    <text x="1020" y="575">5M</text>
    <text x="620" y="610" fill="#111827" font-size="17">Tokens</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="80" y="225" fill="#111827" font-size="21" font-weight="700">Test 1</text>
    <rect x="220" y="185" width="310.4" height="56" rx="6" fill="#2563eb"/>
    <rect x="530.4" y="185" width="289.6" height="56" rx="6" fill="#f59e0b"/>
    <text x="375.2" y="220" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Sol 1.94M</text>
    <text x="675.2" y="220" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Luna 1.81M</text>
    <text x="838" y="220" fill="#111827" font-size="17" font-weight="700">3.75M total</text>

    <text x="80" y="345" fill="#111827" font-size="21" font-weight="700">Test 2</text>
    <rect x="220" y="305" width="500.8" height="56" rx="6" fill="#2563eb"/>
    <rect x="720.8" y="305" width="228.8" height="56" rx="6" fill="#f59e0b"/>
    <text x="470.4" y="340" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Sol 3.13M</text>
    <text x="835.2" y="340" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Luna 1.43M</text>
    <text x="968" y="340" fill="#111827" font-size="17" font-weight="700">4.56M total</text>

    <text x="80" y="465" fill="#111827" font-size="21" font-weight="700">Test 3</text>
    <rect x="216" y="421" width="749.5" height="64" rx="10" fill="none" stroke="#111827" stroke-width="3"/>
    <rect x="220" y="425" width="64.6" height="56" rx="6" fill="#2563eb"/>
    <rect x="284.6" y="425" width="676.9" height="56" rx="6" fill="#f59e0b"/>
    <text x="623" y="460" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Luna 4,230,396</text>
    <text x="980" y="460" fill="#111827" font-size="17" font-weight="700">4,634,248 total</text>
    <line x1="252" y1="415" x2="252" y2="398" stroke="#2563eb" stroke-width="2"/>
    <text x="252" y="388" fill="#2563eb" font-size="16" font-weight="700" text-anchor="middle">Sol 403,852</text>
    <text x="220" y="515" fill="#111827" font-size="16" font-weight="700">Test 3 split: Sol 8.7% · Luna 91.3%</text>
  </g>

  <line x1="80" y1="635" x2="1120" y2="635" stroke="#d1d5db"/>
  <text x="80" y="668" fill="#4b5563" font-family="Arial, sans-serif" font-size="15">Source: Giangero Studio internal runs · Test data supplied by the project author · Not independently reproduced</text>
</svg>
